# MoveIt -> kuka_bridge (FollowJointTrajectory)
trajectory_execution:
  # Cada waypoint es un PTP que para en destino y en T1 depende de que alguien
  # mantenga hombre muerto + Start: la duracion real no tiene relacion con la
  # planificada, asi que MoveIt no debe abortar por tiempo.
  execution_duration_monitoring: false
  allowed_start_tolerance: 0.01   # rad (~0.6 deg)

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
  joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
